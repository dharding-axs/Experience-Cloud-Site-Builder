<!-- Replace all {{prefix}}- class prefixes with your prefix (e.g. swa- → acme-)
     Replace nav link labels and logo alt text with client brand content -->
<template>
    <header class="{{prefix}}-header">
        <div class="{{prefix}}-utility-bar">
            <div class="{{prefix}}-utility-inner">
                <div class="{{prefix}}-utility-spacer"></div>
                <div class="{{prefix}}-utility-right">
                    <a href="#" class="{{prefix}}-lang-link">
                        Espa&ntilde;ol
                        <span class="{{prefix}}-globe-icon">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="2" y1="12" x2="22" y2="12"></line>
                                <path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z"></path>
                            </svg>
                        </span>
                    </a>
                </div>
            </div>
        </div>
        <div class="{{prefix}}-nav-bar">
            <div class="{{prefix}}-nav-inner">
                <div class="{{prefix}}-logo">
                    <!-- Replace logoUrl with @salesforce/resourceUrl/{{prefix}}LogoLight -->
                    <img src={logoUrl} alt="{{ClientName}}" class="{{prefix}}-logo-img" />
                </div>
                <nav class="{{prefix}}-nav">
                    <ul class="{{prefix}}-nav-list">
                        <!-- Replace with client navigation links -->
                        <li><a href="#">NAV ITEM 1</a></li>
                        <li class="{{prefix}}-nav-separator"></li>
                        <li><a href="#">NAV ITEM 2</a></li>
                        <li class="{{prefix}}-nav-separator"></li>
                        <li><a href="#">NAV ITEM 3</a></li>
                    </ul>
                </nav>
                <div class="{{prefix}}-nav-actions">
                    <button class="{{prefix}}-search-btn" aria-label="Search">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                    <button class={hamburgerClass} aria-label="Menu" onclick={toggleMenu}>
                        <span class="{{prefix}}-hamburger-line"></span>
                        <span class="{{prefix}}-hamburger-line"></span>
                        <span class="{{prefix}}-hamburger-line"></span>
                    </button>
                </div>
            </div>
        </div>
        <div class={mobileMenuClass}>
            <ul class="{{prefix}}-mobile-nav-list">
                <!-- Mirror desktop nav links here -->
                <li><a href="#">NAV ITEM 1</a></li>
                <li class="{{prefix}}-mobile-separator"></li>
                <li><a href="#">NAV ITEM 2</a></li>
                <li class="{{prefix}}-mobile-separator"></li>
                <li><a href="#">NAV ITEM 3</a></li>
            </ul>
        </div>
    </header>
</template>
